[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnm-qwen38"
version = "0.2.0"
description = "Explicit host-staged dual GPU PNM emulator"
requires-python = ">=3.10"
dependencies = ["torch==2.14.1", "transformers==5.19.0", "accelerate==1.15.0", "huggingface_hub==2.2.0", "safetensors==0.8.0", "kernels==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires two CUDA GPUs", "model: requires the official full FP8 checkpoint"]
